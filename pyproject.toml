[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextech-force"
version = "0.2.0"
description = "High-rate recording and visualization for Nextech DFS/DFT force gauges (~170 Hz vs the vendor library's 10 Hz)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["force-gauge", "nextech", "dfs", "ftdi", "d2xx", "robotics", "tactile"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]
# The acquisition path is standard-library only, so a bare install stays tiny
# and safe to vendor into another data-collection pipeline. Linux reaches the
# gauge through ftdi_sio + pyserial, so that one dependency is platform-gated.
dependencies = [
    "pyserial>=3.4; sys_platform != 'win32'",
]

[project.optional-dependencies]
serial = ["pyserial>=3.4"]
analysis = ["numpy>=1.20"]
viz = ["numpy>=1.20", "matplotlib>=3.4"]
all = ["numpy>=1.20", "matplotlib>=3.4", "pyserial>=3.4"]
dev = ["pytest>=7", "ruff>=0.1", "mypy>=1.0", "numpy>=1.20", "matplotlib>=3.4", "pyserial>=3.4"]

[project.scripts]
nextech-force = "nextech_force.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nextech_force"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",
    # The project convention is typing-module annotations (Optional[X],
    # Dict[K, V]) rather than PEP 604/585 builtins, so pyupgrade's rewrites
    # are deliberately declined.
    "UP006",
    "UP035",
    "UP045",
]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
